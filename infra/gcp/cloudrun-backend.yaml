apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: duribeon-backend
spec:
  template:
    spec:
      containers:
        - image: asia-northeast3-docker.pkg.dev/PROJECT_ID/duribeon/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: CORS_ORIGINS
              value: https://YOUR_FRONTEND_DOMAIN
            - name: UPSTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upstage-api-key
                  key: latest
            - name: GUEST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: guest-jwt-secret
                  key: latest
